name: Build and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: lolcatz
          POSTGRES_PASSWORD: lolcatz
          POSTGRES_DB: lolcatz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lolcatz -d lolcatz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: Validate Helm chart
        run: |
          helm lint chart
          helm lint chart --set internalTLS.enabled=true
          helm template lolcatz chart --namespace chart-review >/dev/null
          helm template lolcatz chart --namespace chart-review --set admin.enabled=false >/dev/null
          helm template lolcatz chart --namespace chart-review --set internalTLS.enabled=true >/dev/null
          helm template lolcatz chart --namespace chart-review --set internalTLS.enabled=true,admin.enabled=false >/dev/null
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: services/go.sum
      - name: Test Go services
        env:
          S3_BUCKET: test
          S3_ENDPOINT: storage.example.test
          S3_USE_SSL: "true"
        working-directory: services
        run: go test ./...
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Test frontend
        working-directory: services/frontend
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Test consumers
        env:
          TEST_DATABASE_URL: postgres://lolcatz:lolcatz@localhost:5432/lolcatz?sslmode=disable
        run: |
          pip install --require-hashes -r services/thumbnailer/requirements.lock
          pip install --no-index --no-deps -r services/thumbnailer/requirements.txt
          PYTHONPATH=services python3 -m unittest discover -s services/tests
          PYTHONPATH=services python3 -m unittest discover -s services/thumbnailer
          PYTHONPATH=services python3 -m unittest discover -s services/tagger -t services

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start plaintext integration stack
        run: docker compose up --build -d
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/ && curl --fail --silent http://localhost:3000/api/browse/boards; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Integration tests
        run: |
          docker compose run --build --rm go-tests
          docker compose run --build --rm search-tests
          docker compose run --rm node-tools node test/integration.mjs
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down -v

  images:
    needs: [checks, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: uploader
            dockerfile: services/Dockerfile.golang
            go-service: uploader
          - service: admin
            dockerfile: services/Dockerfile.golang
            go-service: admin
          - service: comments
            dockerfile: services/Dockerfile.golang
            go-service: comments
          - service: browse
            dockerfile: services/Dockerfile.golang
            go-service: browse
          - service: search
            dockerfile: services/Dockerfile.search
          - service: exif
            dockerfile: services/Dockerfile.golang
            go-service: exif
          - service: thumbnailer
            dockerfile: services/Dockerfile.thumbnailer
          - service: ocr
            dockerfile: services/Dockerfile.ocr
          - service: tagger
            dockerfile: services/Dockerfile.tagger
          - service: tagger-model
            dockerfile: services/Dockerfile.tagger-model
          - service: frontend
            dockerfile: services/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lolcatz-${{ matrix.service }}
        run: |
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
          echo EOF >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.go-service }}
          platforms: linux/amd64
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/codemowers
            org.opencontainers.image.vendor=Codemowers OÜ
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lolcatz-${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: vulnerabilities.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: vulnerabilities-${{ matrix.service }}
          path: vulnerabilities.sarif
      - name: Record immutable release image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          key="$SERVICE"
          if [ "$key" = tagger-model ]; then key=taggerModel; fi
          printf '%s:\n  image: ghcr.io/%s/lolcatz-%s@%s\n' "$key" "$GITHUB_REPOSITORY_OWNER" "$SERVICE" "$DIGEST" > "$SERVICE.yaml"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-image-${{ matrix.service }}
          path: ${{ matrix.service }}.yaml

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Assemble release values
        run: |
          printf '# Source and configuration revision: %s\n' "$GITHUB_SHA" > release-values.yaml
          cat release-images/*.yaml >> release-values.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: release-values
          path: release-values.yaml

  chart:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart with release images
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${VERSION#v}"
          mkdir -p "$RUNNER_TEMP/chart" "$RUNNER_TEMP/package"
          cp -R chart/. "$RUNNER_TEMP/chart/"
          sed -i "s|^imageRegistry:.*|imageRegistry: ghcr.io/${OWNER}|" "$RUNNER_TEMP/chart/values.yaml"
          for service in uploader admin comments browse search exif thumbnailer ocr tagger tagger-model frontend; do
            image="ghcr.io/${OWNER}/lolcatz-${service}:${VERSION}"
            digest="$(docker buildx imagetools inspect "$image" | awk '/Digest:/ { print $2; exit }')"
            test -n "$digest"
            sed -i "s|image: lolcatz-${service}:latest|image: lolcatz-${service}@${digest}|" "$RUNNER_TEMP/chart/values.yaml"
          done
          helm package "$RUNNER_TEMP/chart" --destination "$RUNNER_TEMP/package" --version "$version" --app-version "$VERSION"
          helm push "$RUNNER_TEMP/package/lolcatz-$version.tgz" "oci://ghcr.io/${OWNER}/charts"
