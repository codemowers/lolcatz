apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: lolcatz

build:
  platforms:
    - linux/amd64
  tagPolicy:
    inputDigest: {}
  # Build on your laptop and push using local Docker registry credentials.
  # Configure your context-specific default-repo and registry login (see README.md).
  local:
    concurrency: 0
    push: true
    useDockerCLI: true
    useBuildkit: true

  artifacts:
    - image: lolcatz-uploader
      docker:
        dockerfile: services/Dockerfile.golang
        buildArgs:
          SERVICE: uploader
    - image: lolcatz-browse
      docker:
        dockerfile: services/Dockerfile.golang
        buildArgs:
          SERVICE: browse
    - image: lolcatz-search
      docker:
        dockerfile: services/Dockerfile.search
    - image: lolcatz-comments
      docker:
        dockerfile: services/Dockerfile.golang
        buildArgs:
          SERVICE: comments
    - image: lolcatz-thumbnailer
      docker:
        dockerfile: services/Dockerfile.thumbnailer
    - image: lolcatz-frontend
      docker:
        dockerfile: services/Dockerfile.frontend

# Inherit the selected kubeconfig context and its namespace.
# Leave release and port-forward namespaces unset.
manifests:
  helm:
    releases:
      - name: lolcatz
        chartPath: chart
        skipTests: true
        setValues:
          imageRegistry: ""
          # Leave room for PostgreSQL in the sandbox memory quota.
          thumbnailerWorker.enabled: false
          exif.enabled: false
          admin.enabled: false
        # Helm test hooks and image volumes are outside automatic image replacement.
        setValueTemplates:
          frontend.image: "{{.IMAGE_FULLY_QUALIFIED_lolcatz_frontend}}"

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true

# Admin, EXIF, OCR, the tagger and the thumbnail worker are off by default; `skaffold dev -p full`
# builds and deploys every component.
profiles:
  - name: full
    patches:
      - op: add
        path: /build/artifacts/-
        value:
          image: lolcatz-admin
          docker:
            dockerfile: services/Dockerfile.golang
            buildArgs:
              SERVICE: admin
      - op: add
        path: /build/artifacts/-
        value:
          image: lolcatz-exif
          docker:
            dockerfile: services/Dockerfile.golang
            buildArgs:
              SERVICE: exif
      - op: add
        path: /build/artifacts/-
        value:
          image: lolcatz-tagger
          docker:
            dockerfile: services/Dockerfile.tagger
      - op: add
        path: /build/artifacts/-
        value:
          image: lolcatz-tagger-model
          docker:
            dockerfile: services/Dockerfile.tagger-model
      - op: add
        path: /build/artifacts/-
        value:
          image: lolcatz-ocr
          docker:
            dockerfile: services/Dockerfile.ocr
      - op: add
        path: /manifests/helm/releases/0/setValues/tagger.enabled
        value: true
      - op: replace
        path: /manifests/helm/releases/0/setValues/exif.enabled
        value: true
      - op: replace
        path: /manifests/helm/releases/0/setValues/admin.enabled
        value: true
      - op: add
        path: /manifests/helm/releases/0/setValues/ocr.enabled
        value: true
      - op: replace
        path: /manifests/helm/releases/0/setValues/thumbnailerWorker.enabled
        value: true
      # Automatic image-volume replacement will simplify this:
      # https://github.com/GoogleContainerTools/skaffold/pull/10193
      - op: add
        path: /manifests/helm/releases/0/setValueTemplates/taggerModel.image
        value: "{{.IMAGE_FULLY_QUALIFIED_lolcatz_tagger_model}}"

portForward:
  - resourceType: service
    resourceName: lolcatz-frontend
    port: 3000
    localPort: 3000
  - resourceType: service
    resourceName: lolcatz-uploader
    port: 8080
    localPort: 8081
