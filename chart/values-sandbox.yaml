# Overrides for a platform-manager sandbox. Set the three per-sandbox values on
# install, e.g. for namespace sb-372e59-liivakast on aws-us-west-2-bravo:
#
#   helm install lolcatz ./chart -n sb-372e59-liivakast -f chart/values-sandbox.yaml \
#     --set storage.existingPolicy=372e59-liivakast-rw \
#     --set oidcIssuerAccess.ingressAddress=10.100.174.227 \
#     --set oidcIssuerAccess.host=auth.aws-us-west-2-bravo.codemowers.io
#
# All three come from the namespace's `sandbox-info` ConfigMap
# (`kubectl get configmap sandbox-info -o yaml`): the policy is its `sandbox`
# key plus `-rw`, the address is `ingressAddress` and the host is
# `oidcIssuerHost`.
#
# CPU requests are about a third of the defaults, about 1 CPU in all with
# 3.2Gi memory, so many sandboxes can share a cluster; limits are unchanged,
# so an idle app still bursts when used. Redpanda keeps 500m, since its chart
# derives the broker's core count from its CPU resources.

storage:
  # Sandboxes cap each bucket at 10Gi; many sandboxes share one object store.
  quota: 1073741824
  existingPolicy: ""

database:
  storage: 5Gi
  resources: {requests: {cpu: 50m}}

redpanda:
  storage: 5Gi

oidcIssuerAccess:
  host: ""
  ingressAddress: ""

uploader: {resources: {requests: {cpu: 25m}}}
browse: {resources: {requests: {cpu: 25m}}}
search: {resources: {requests: {cpu: 25m}}}
comments: {resources: {requests: {cpu: 25m}}}
admin: {resources: {requests: {cpu: 25m}}}
exif: {resources: {requests: {cpu: 25m}}}
frontend: {resources: {requests: {cpu: 25m}}}
ocr: {resources: {requests: {cpu: 50m}}}
thumbnailer: {resources: {requests: {cpu: 50m}}}
thumbnailerWorker: {resources: {requests: {cpu: 50m}}}
tagger: {resources: {requests: {cpu: 100m}}}
redis: {resources: {requests: {cpu: 25m}}}
