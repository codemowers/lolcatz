# Lighter requests for a platform-manager sandbox, whose ResourceQuota is
# 2 CPU / 4Gi / 20Gi of volumes for the small size. Limits are unchanged.
#
#   helm install lolcatz ./chart -n <sandbox-namespace> -f chart/values-sandbox.yaml
#
# Redpanda keeps 500m: its chart derives the broker's core count from its CPU
# request.

database:
  storage: 5Gi
  resources: {requests: {cpu: 50m}}

redpanda:
  storage: 5Gi

uploader: {resources: {requests: {cpu: 25m}}}
browse: {resources: {requests: {cpu: 25m}}}
search: {resources: {requests: {cpu: 25m}}}
comments: {resources: {requests: {cpu: 25m}}}
admin: {resources: {requests: {cpu: 25m}}}
exif: {resources: {requests: {cpu: 25m}}}
frontend: {resources: {requests: {cpu: 25m}}}
ocr: {resources: {requests: {cpu: 50m}}}
thumbnailer: {resources: {requests: {cpu: 50m}}}
thumbnailerWorker: {resources: {requests: {cpu: 50m}}}
tagger: {resources: {requests: {cpu: 100m}}}
redis: {resources: {requests: {cpu: 25m}}}
