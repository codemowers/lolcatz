# Overrides for a platform-manager sandbox. Set the three per-sandbox values on
# install, e.g. for namespace sb-372e59-liivakast on aws-us-west-2-bravo:
#
#   helm install lolcatz ./chart -n sb-372e59-liivakast -f chart/values-sandbox.yaml \
#     --set storage.existingPolicy=372e59-liivakast-rw \
#     --set oidcIssuerAccess.ingressAddress=10.100.174.227 \
#     --set oidcIssuerAccess.host=auth.aws-us-west-2-bravo.codemowers.io
#
# All three come from the namespace's `sandbox-info` ConfigMap
# (`kubectl get configmap sandbox-info -o yaml`): the policy is its `sandbox`
# key plus `-rw`, the address is `ingressAddress` and the host is
# `oidcIssuerHost`.
#
# The requests add up to about 1.5 CPU and 3.2Gi memory, which fits a small
# sandbox (2 CPU, 4Gi) alongside the platform's own Prometheus and registry.

storage:
  # Sandboxes cap each bucket at 10Gi.
  quota: 5368709120
  existingPolicy: ""

database:
  storage: 5Gi

redpanda:
  storage: 5Gi

oidcIssuerAccess:
  host: ""
  ingressAddress: ""
