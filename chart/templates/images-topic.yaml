apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata:
  name: lolcatz-images
  annotations:
    kubernetes.io/description: >-
      Keyed by image ID and compacted to retain the latest live event per image
      as a complete replay source, sized by image count rather than time.
      Deletes are published as tombstones.
spec:
  cluster:
    clusterRef:
      name: lolcatz-redpanda
  partitions: 3
  # One broker; the platform sets three where it runs Redpanda highly
  # available. Left unset, the operator sends -1 and the topic never exists.
  replicationFactor: 1
  additionalConfig:
    cleanup.policy: compact
