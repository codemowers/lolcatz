apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: lolcatz-frontend
  annotations:
    kubernetes.io/description: "Login for the Can I haz Kubernetes image board"
spec:
  displayName: Lolcatz
  applicationType: web
  grantTypes:
    - authorization_code
    - refresh_token
  responseTypes:
    - code
  tokenEndpointAuthMethod: client_secret_basic
  pkce: true
  redirectUris:
    - https://{{ .Values.domain }}/api/auth/callback
  uri: https://{{ .Values.domain }}/
  # The audience the browser asks a token for and the APIs validate (RFC 8707);
  # clusters that require a resource allow-list refuse login without it.
  allowedResources:
    - https://{{ .Values.domain }}/api
  availableScopes:
    - openid
    - profile
    - email
    - groups
    - lolcatz:images:read
    - lolcatz:images:write
    - lolcatz:comments:write
    - lolcatz:boards:write
