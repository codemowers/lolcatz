apiVersion: v1
kind: Service
metadata:
  name: lolcatz-browse
  {{- if .Values.internalTLS.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-lolcatz-browse@kubernetescrd
  {{- end }}
spec:
  selector:
    app: lolcatz-browse
  ports:
    - name: {{ include "lolcatz.internalScheme" . }}
      port: 8080
      targetPort: {{ include "lolcatz.internalScheme" . }}
