apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata:
  name: lolcatz-tags
  annotations:
    kubernetes.io/description: >-
      Complete YOLO annotations grouped by class name, keyed by image ID.
      Each run replaces the previous result, including an empty object when
      nothing is detected. Image deletions are forwarded as tombstones.
spec:
  cluster:
    clusterRef:
      name: lolcatz-redpanda
  partitions: 3
  # One broker; the platform sets three where it runs Redpanda highly
  # available. Left unset, the operator sends -1 and the topic never exists.
  replicationFactor: 1
  additionalConfig:
    cleanup.policy: compact
