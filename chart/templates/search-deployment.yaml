apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-search
spec:
  selector:
    matchLabels:
      app: lolcatz-search
  template:
    metadata:
      labels:
        app: lolcatz-search
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.internalTLS.enabled }}
      volumes:
        - name: server-tls
          secret:
            secretName: lolcatz-search-internal-tls
      {{- end }}
      containers:
        - name: search
          securityContext:
            readOnlyRootFilesystem: true
          image: {{ include "lolcatz.image" (dict "registry" .Values.imageRegistry "image" .Values.search.image) }}
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
            - name: {{ include "lolcatz.internalScheme" . }}
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            - name: server-tls
              mountPath: /etc/server-tls
              readOnly: true
          {{- end }}
          env:
            - name: ROCKET_ADDRESS
              value: "::"
            {{- if .Values.internalTLS.enabled }}
            - name: TLS_CERT_FILE
              value: /etc/server-tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/server-tls/tls.key
            {{- end }}
            - name: PGSSLMODE
              value: verify-full
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
          resources:
            {{- toYaml .Values.search.resources | nindent 12 }}
