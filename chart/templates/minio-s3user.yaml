apiVersion: s3.onyxia.sh/v1alpha1
kind: S3User
metadata:
  name: lolcatz-storage
spec:
  s3InstanceRef: minio/default
  accessKey: {{ .Release.Namespace }}.lolcatz-storage
  policies:
    # The sandbox's platform-rendered policy: read/write on every bucket of
    # the namespace. Sandboxes cannot create policies of their own.
    - {{ trimPrefix "sb-" .Release.Namespace }}-rw
