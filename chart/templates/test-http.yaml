apiVersion: v1
kind: Pod
metadata:
  name: lolcatz-test-http
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  {{- if .Values.internalTLS.enabled }}
  volumes:
    - name: cluster-ca
      configMap:
        name: trusted-ca-certs
  {{- end }}
  containers:
    - name: test
      image: {{ include "lolcatz.image" (dict "registry" .Values.imageRegistry "image" .Values.frontend.image) }}
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      {{- if .Values.internalTLS.enabled }}
      volumeMounts:
        - name: cluster-ca
          mountPath: /etc/cluster-ca
          readOnly: true
      {{- end }}
      command:
        - node
        - --input-type=module
        - -e
      args:
        - |
          import assert from 'node:assert/strict';
          const services = ['browse', 'comments', 'search', 'thumbnailer', 'uploader', 'frontend'{{ if .Values.admin.enabled }}, 'admin'{{ end }}];
          for (const service of services) {
            const port = service === 'frontend' ? 3000 : 8080;
            const url = `{{ include "lolcatz.internalScheme" . }}://lolcatz-${service}.{{ .Release.Namespace }}.svc.cluster.local:${port}/api/__transport_probe_not_found`;
            const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
            assert.equal(response.status, 404, url);
            console.log(`${service}: {{ if .Values.internalTLS.enabled }}TLS verified, {{ end }}application listener reachable`);
          }
