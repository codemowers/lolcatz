apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-exif
spec:
  selector:
    matchLabels:
      app: lolcatz-exif
  template:
    metadata:
      labels:
        app: lolcatz-exif
    spec:
      terminationGracePeriodSeconds: 120
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exif
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: {{ include "lolcatz.image" (dict "registry" .Values.imageRegistry "image" .Values.exif.image) }}
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: KAFKA_USERNAME
              value: lolcatz-exif
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lolcatz-exif-kafka
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: KAFKA_TLS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: KAFKA_BROKERS
              value: lolcatz-redpanda.{{ .Release.Namespace }}.svc.cluster.local:9093
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: region
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: publicEndpoint
            - name: S3_USE_SSL
              value: "true"
            - name: S3_BUCKET
              value: {{ .Release.Namespace }}.lolcatz
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: secretKey
          resources:
            {{- toYaml .Values.exif.resources | nindent 12 }}
