{{- if eq (include "lolcatz.componentEnabled" (dict "name" "thumbnailer-worker" "values" .Values)) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-thumbnailer-worker
spec:
  selector:
    matchLabels:
      app: lolcatz-thumbnailer-worker
  template:
    metadata:
      labels:
        app: lolcatz-thumbnailer-worker
    spec:
      terminationGracePeriodSeconds: 120
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thumbnailer-worker
          securityContext:
            readOnlyRootFilesystem: true
          image: {{ include "lolcatz.image" (dict "registry" .Values.imageRegistry "image" .Values.thumbnailer.image) }}
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          command:
            - python
            - worker.py
          env:
            - name: KAFKA_USERNAME
              value: lolcatz-thumbnailer-worker
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lolcatz-thumbnailer-worker-kafka
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: KAFKA_TLS
              value: "true"
            - name: KAFKA_BROKERS
              value: lolcatz-redpanda.{{ .Release.Namespace }}.svc.cluster.local:9093
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: publicEndpoint
            - name: S3_USE_SSL
              value: "true"
            - name: S3_BUCKET
              value: {{ .Release.Namespace }}.lolcatz
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: secretKey
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: lolcatz-storage
                  key: region
          resources:
            {{- toYaml .Values.thumbnailerWorker.resources | nindent 12 }}
{{- end }}
